<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #0d0d0f;
    --surface: #141416;
    --border:  #222226;
    --accent:  #e8622a;
    --accent2: #f0944d;
    --text:    #f0ede8;
    --muted:   #6b6b72;
    --danger:  #e85555;
    --success: #3dd68c;
    --radius:  14px;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .brand { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .brand span { color: var(--accent); }

  .badge-admin {
    background: rgba(232,98,42,0.15);
    border: 1px solid rgba(232,98,42,0.3);
    color: var(--accent);
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 20px;
  }

  .nav-right { display: flex; align-items: center; gap: 12px; }

  .btn-nav {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; padding: 6px 14px;
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
    text-decoration: none; display: inline-block;
  }
  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

  /* MAIN */
  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

  .page-header { margin-bottom: 32px; }
  .page-header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 30px; font-weight: 800;
    letter-spacing: -0.8px; margin-bottom: 6px;
  }
  .page-header p { color: var(--muted); font-size: 14px; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }

  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 24px;
  }

  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }

  /* TABELA */
  .table-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  .table-header {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .table-header h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }

  .search-input {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; width: 200px; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left; padding: 14px 24px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  td { padding: 16px 24px; border-bottom: 1px solid #1a1a1d; font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .user-cell { display: flex; align-items: center; gap: 12px; }

  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  .user-name  { font-weight: 500; font-size: 14px; }
  .user-email { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .role-badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .role-admin {
    background: rgba(232,98,42,0.15);
    border: 1px solid rgba(232,98,42,0.3);
    color: var(--accent);
  }

  .role-user {
    background: rgba(107,107,114,0.15);
    border: 1px solid rgba(107,107,114,0.25);
    color: var(--muted);
  }

  .actions { display: flex; gap: 8px; }

  .btn-sm {
    background: transparent; font-family: 'DM Sans', sans-serif;
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s; border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-promote { }
  .btn-promote:hover { border-color: var(--success); color: var(--success); }
  .btn-revoke:hover  { border-color: var(--muted); color: var(--text); }
  .btn-delete:hover  { border-color: var(--danger); color: var(--danger); }

  .av0 { background: linear-gradient(135deg,#e8622a,#f0944d); }
  .av1 { background: linear-gradient(135deg,#5b6af0,#9b5bdb); }
  .av2 { background: linear-gradient(135deg,#2ab4e8,#2ae8c3); }
  .av3 { background: linear-gradient(135deg,#e8a82a,#e8622a); }
  .av4 { background: linear-gradient(135deg,#2ae870,#2ab4e8); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: 1fr; }
    .table-header { flex-direction: column; gap: 12px; align-items: flex-start; }
    .search-input { width: 100%; }
  }
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="brand">Nexus<span>.</span></div>
    <span class="badge-admin">Admin</span>
  </div>
  <div class="nav-right">
    <a href="feed.html" class="btn-nav">Ver feed</a>
    <button class="btn-nav" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container">

  <div class="page-header">
    <h1>Painel de administração</h1>
    <p>Gerencie usuários, funções e permissões.</p>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total de usuários</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Administradores</div>
      <div class="stat-value accent" id="statAdmins">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Usuários comuns</div>
      <div class="stat-value success" id="statUsers">—</div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <h2>Usuários cadastrados</h2>
      <input class="search-input" type="text" id="searchInput" placeholder="Buscar usuário..." oninput="filtrar()">
    </div>
    <table>
      <thead>
        <tr>
          <th>Usuário</th>
          <th>ID</th>
          <th>Função</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>

</div>

<script>
  const token  = localStorage.getItem('token');
  const role   = localStorage.getItem('role');
  const myId   = Number(localStorage.getItem('id'));

  if (!token || role !== 'admin') window.location.href = 'index.html';

  let allUsers = [];

  function avatarClass(email) {
    let h = 0;
    for (const c of (email || '')) h = (h * 31 + c.charCodeAt(0)) & 0xff;
    return 'av' + (h % 5);
  }

  async function carregarUsuarios() {
    const res   = await fetch('/users', { headers: { 'Authorization': 'Bearer ' + token } });
    allUsers    = await res.json();
    renderTabela(allUsers);

    const admins = allUsers.filter(u => u.role === 'admin').length;
    document.getElementById('statTotal').textContent  = allUsers.length;
    document.getElementById('statAdmins').textContent = admins;
    document.getElementById('statUsers').textContent  = allUsers.length - admins;
  }

  function renderTabela(users) {
    const tbody = document.getElementById('userTable');
    if (!users.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:40px">Nenhum usuário encontrado.</td></tr>`;
      return;
    }

    tbody.innerHTML = users.map(u => {
      const isMe  = Number(u.id) === myId;
      const avCls = avatarClass(u.email);
      const ini   = (u.name || u.email)[0].toUpperCase();
      const isAdm = u.role === 'admin';

      return `<tr>
        <td>
          <div class="user-cell">
            <div class="user-avatar ${avCls}">${ini}</div>
            <div>
              <div class="user-name">${u.name || '—'} ${isMe ? '<span style="color:var(--muted);font-size:11px">(você)</span>' : ''}</div><div style="font-size:12px;color:var(--accent);margin-top:2px">${u.username ? '@' + u.username : ''}</div>
              <div class="user-email">${u.email}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--muted)">#${u.id}</td>
        <td><span class="role-badge ${isAdm ? 'role-admin' : 'role-user'}">${isAdm ? 'admin' : 'user'}</span></td>
        <td>
          <div class="actions">
            ${!isAdm ? `<button class="btn-sm btn-promote" onclick="promover(${u.id})">Promover</button>` : ''}
            ${isAdm && !isMe ? `<button class="btn-sm btn-revoke" onclick="revogar(${u.id})">Revogar</button>` : ''}
            ${!isMe ? `<button class="btn-sm btn-delete" onclick="deletar(${u.id})">Excluir</button>` : ''}
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function filtrar() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderTabela(allUsers.filter(u =>
      (u.name || '').toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    ));
  }

  async function promover(id) {
    if (!confirm('Promover este usuário a admin?')) return;
    await fetch(`/admin/${id}/promote`, { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token } });
    carregarUsuarios();
  }

  async function revogar(id) {
    if (!confirm('Remover função admin deste usuário?')) return;
    await fetch(`/admin/${id}/revoke`, { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token } });
    carregarUsuarios();
  }

  async function deletar(id) {
    if (!confirm('Excluir este usuário permanentemente?')) return;
    await fetch(`/users/${id}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
    carregarUsuarios();
  }

  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  carregarUsuarios();
</script>
</body>
</html>
